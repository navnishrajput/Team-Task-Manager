# ============================================
# APPLICATION CONFIGURATION
# ============================================
spring.application.name=team-task-manager
server.port=8080
server.servlet.context-path=/api
server.servlet.session.persistent=true
server.servlet.session.timeout=30d

# ============================================
# DATABASE CONFIGURATION
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.jdbc.batch_size=20

# ============================================
# SQL INIT
# ============================================
spring.sql.init.mode=never

# ============================================
# JWT - 30 DAYS EXPIRATION
# ============================================

app.jwt.secret=${APP_JWT_SECRET:TeamTaskManagerSuperSecretKeyForJWTTokenGeneration2024WithVeryLongStringForSecurityAndMoreLengthAndExtraCharactersToMakeItSecureEnoughForProductionUseWithEvenMoreRandomDataAddedHereForMaximumSecurity}
app.jwt.expiration=2592000000
app.jwt.refresh-expiration=7776000000

# ============================================
# CORS
# ============================================
#app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://team-task-manager-production-nr.up.railway.app}
# LOGGING
# ============================================
logging.level.root=WARN
logging.level.com.teamtask=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# ============================================
# SPRING MAIN
# ============================================
spring.main.allow-circular-references=true